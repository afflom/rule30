spec = "template/1"

[[id]]
id = "problem1"
level = "open"
suite = "register"
statement = "The center column of Rule 30 from a single black cell is not eventually periodic."

[[id]]
id = "coupling-law"
level = "build"
suite = "register"
statement = "With the center agreeing at t, the next center defect is leftDefect(t,1) XOR ((not center t) AND rightDefect(t,1)); a center period is exactly this coupling at every later time."

[[id]]
id = "aperiodic-compensation"
level = "open"
suite = "register"
statement = "The bulk carries, with both edge bands stripped (interiorEightDiagonal: diagonals >= 3 on the regular side and >= 6 on the chaotic side), are never the ruler background trailingParity (t-2) XOR not timeParity t XOR trailingParity (t-4) XOR trailingParity ((t-4)/2) plus a periodic sequence: EightAperiodic. Equivalent to Problem 1 (left-band), to ThreeAperiodic (three-diagonal-band) and to InteriorAperiodic (interior-aperiodicity). This is the remaining obligation."

[[id]]
id = "q-adic-descent"
level = "some-true"
suite = "register"
statement = "The q-adic order of the observer defect carries a descent quantity."

[[id]]
id = "front-slack-descent"
level = "some-true"
suite = "register"
statement = "Phi_t = R_t - k_t (q-rank minus front depth) is a non-increasing potential."

[[id]]
id = "evaluation-point"
level = "some-true"
suite = "register"
statement = "Evaluating the observer polynomial at a constant point (0, 1, omega, omega^2) constrains the center."

[[id]]
id = "gate-phase-opposition"
level = "some-true"
suite = "register"
statement = "At a coupled arrival the gate phase is the negative of centerSign * rightPhase(start, 2)."

[[id]]
id = "band-engines"
level = "some-true"
suite = "register"
statement = "The lhBandAgree / prefix-tail / late-scale engine hypothesis bundles refute a periodic center."

[[id]]
id = "recurrent-central-collision"
level = "build"
suite = "register"
statement = "Problem 1 is equivalent to: under every hypothetical center period, central collisions do not occur arbitrarily late in the band of width 2P."

[[id]]
id = "saturation-reexcitation"
level = "some-true"
suite = "register"
statement = "Under a periodic center, each front arrival injects a unit boundary bit that re-excites the observer polynomial, so the center cannot settle (the RF/photonics heat-death reading)."

[[id]]
id = "horizon-criterion"
level = "open"
suite = "register"
statement = "For every T and P > 0 there is an explicit horizon H(T, P) such that CenterPeriodic T P already fails on the window [T, T + H(T, P)]: a flip forced by the doubling zero diagonal of P reaches column -1 inside the window while the gated mirror forbids it there."

[[id]]
id = "horizon-certificate"
level = "build"
suite = "register"
statement = "For every transient T ≤ 512 and period 0 < P ≤ 128 the center disagrees with its lag-P shift at a time in [T, T + 32): the horizon H = 32 is a kernel-checked certificate on these ranges."

[[id]]
id = "left-defect-sourcing"
level = "build"
suite = "register"
statement = "Under a periodic center, a left defect at depth k at time t is sourced by a right column-one defect at a time in [t, t + k); equivalently column-one agreement on [t, t + k) forces the whole left cone of depth k at t to agree."

[[id]]
id = "first-failure-2adic"
level = "some-true"
suite = "register"
statement = "The first time a hypothetical center period (T, P) fails is governed by the 2-adic data of P and T (the scale mismatch between the periodically seeded right half and the doubling-time reconstruction of the left edge), so the closing invariant can be read off the first failing comparison."

[[id]]
id = "ledger-diagonal"
level = "build"
suite = "register"
statement = "The center column is the complement of the diagonal of the carry ledger: center t = not (bit t of winWitt 0 t), because row t = q^t XOR ledger and the central trinomial coefficient of q^t is odd; hence a center period is exactly a period of the ledger diagonal."

[[id]]
id = "periodic-finite-kernel"
level = "build"
suite = "register"
statement = "A periodic center has a finite 2-kernel: under CenterPeriodic T P every subsequence t -> center(2^k t + r), r < 2^k, is one of an explicit finite family (the kernel subsequences with 2^k < T + P, and t -> if t = 0 then b else center(T + (u t + v) mod P) with u, v < P)."

[[id]]
id = "center-infinite-kernel"
level = "open"
suite = "register"
statement = "The center column is not 2-automatic: its 2-kernel, the family of subsequences t -> center(2^k t + r) with r < 2^k, is infinite. By Christol this is the transcendence of the series sum center(t) y^t over F_2(y); by Rowland-Yassawi it says the center is not a column of any linear cellular automaton over F_2."

[[id]]
id = "kernel-self-similarity"
level = "build"
suite = "register"
statement = "A finite 2-kernel forces a dyadic self-similarity of the center: some k < k' with center(2^k' t) = center(2^k t) for all t (pigeonhole along the zero path of the kernel tree); hence Problem 1 follows from NoDyadicSelfSimilarity."

[[id]]
id = "no-dyadic-self-similarity"
level = "open"
suite = "register"
statement = "For all k < k' there is a time t with center(2^k' t) != center(2^k t): the center column is not self-similar under any dyadic dilation."

[[id]]
id = "dilation-reduction"
level = "build"
suite = "register"
statement = "A finite 2-kernel makes every dilation sequence j -> center(2^j t) eventually periodic with one common period; hence Problem 1 follows if a single dilation sequence, in particular the dyadic column j -> center(2^j), is not eventually periodic."

[[id]]
id = "dyadic-column-aperiodic"
level = "open"
suite = "register"
statement = "The dyadic column j -> center(2^j) is not eventually periodic."

[[id]]
id = "base-generic-reduction"
level = "build"
suite = "register"
statement = "For every base b >= 2 and every t, Problem 1 follows if the b-dilation sequence j -> center(b^j t) is not eventually periodic: a periodic center has a finite b-kernel, a finite b-kernel forces a b-adic self-similarity, and that makes every b-dilation sequence eventually periodic."

[[id]]
id = "some-base-dilation-aperiodic"
level = "open"
suite = "register"
statement = "There are a base b >= 2 and a time t such that the dilation sequence j -> center(b^j t) is not eventually periodic."

[[id]]
id = "kappa-collapse"
level = "build"
suite = "register"
statement = "kappa-collapse at scale K (every cone window response at scales >= K vanishes, i.e. the carries no longer reach the center) is exactly a center period 2^K from time 0; the horizon certificate refutes it for K <= 7, and Problem 1 is equivalent to no kappa-collapse at any scale together with no period that is not a power of two."

[[id]]
id = "dyadic-response-reduction"
level = "build"
suite = "register"
statement = "At time 2^j the right cell at distance 2^j is the black edge, so center(2^(j+1)) = not center(2^j) XOR response(2^j, j); hence Problem 1 follows if the responses on the dyadic diagonal, j -> response(2^j, j), are not eventually periodic."

[[id]]
id = "dyadic-response-aperiodic"
level = "open"
suite = "register"
statement = "The responses on the dyadic diagonal, j -> response(2^j, j) (the window [2^j, 2^(j+1)) read at the center), are not eventually periodic."

[[id]]
id = "all-rules-facet"
level = "build"
suite = "register"
statement = "Every elementary rule has a unique algebraic normal form over F_2 (decided for all 256 codes), every normal form is its linear part XOR its nonlinear part, and Rule 30 is the unique code with normal form a XOR b XOR c XOR bc: the ledger decomposition is coherent across all rules, and the solution is a property of the single carry monomial bc under the linear part 1 + X + X^2."

[[id]]
id = "edge-interior-split"
level = "build"
suite = "register"
statement = "Two carry events of every row are explicit (the left edge pair and the right pair at the right edge); removing them splits the ledger by linearity into an edge-sourced ledger, the Rule-150 evolution of a periodic source, and the ledger of the interior carries, and center t = not (edgeDiagonal t XOR interiorDiagonal t)."

[[id]]
id = "edge-diagonal-formula"
level = "build"
suite = "register"
statement = "The edge diagonal is an explicit 2-automatic expression: edgeLedger t is the Rule-150 propagation of the edge events, so edgeDiagonal t = edgeFormula t t, the XOR over m < t of trinomialParity (t-1-m) (t-2m-1) XOR [rdiag 1 m] trinomialParity (t-1-m) (t-2); hence center t = not (edgeFormula t t XOR interiorDiagonal t)."

[[id]]
id = "interior-diagonal-formula"
level = "build"
suite = "register"
statement = "Bit t of q^n times y is the convolution of the bits of y with the trinomial row (testBit_phiLinearPow_conv), so the interior diagonal is the explicit XOR over the rows m < t of the convolution of row m's interior carries with trinomialParity (t-1-m), and center t = not (edgeFormula t t XOR interiorFormula t t): the center is fully explicit in the carries."

[[id]]
id = "route-a-band-discharge"
level = "some-true"
suite = "register"
statement = "Route A (dyadic reflection): discharge the single-row spatial-agreement hypothesis of the terminal refutations 9.1496-9.1516 under a periodic center with Q = c 2^K P and K large, so that lhBandAgree(z+p+1, Q, 1, S) with S >= p + 3Q follows and the terminal theorems close Problem 1."

[[id]]
id = "route-c-rank-drop"
level = "some-true"
suite = "register"
statement = "Route C (cyclotomic rank drop): link the carry-ledger congruences modulo q^(2^a) and the page charge to show the observer source flux cannot supply the q-divisibility needed to keep the q-rank non-negative as t grows, closing Problem 1."

[[id]]
id = "route-b-reset-mismatch"
level = "some-true"
suite = "register"
statement = "Route B (reset flux jump): between the doubling diagonal z+1 at time t and the reset diagonal z+3 at time t+1, which share the arrival time 2t-z-2 and hence the same import balance, the sum diagonalPhase + diagonalFlux changes by a unit, contradicting periodic_diagonal_import_balance and closing Problem 1."

[[id]]
id = "edge-parity"
level = "build"
suite = "register"
statement = "The edge background of the center is the time parity: edgeDiagonal t = timeParity t, i.e. t mod 2. The column parity of the trinomial triangle is Thue-Morse shifted by one (columnParity (2e+1) = columnParity e, columnParity (2e+2) = not columnParity e, from trinomialParity n n = true), the right-pair part is the same sequence read at (t-2)/2 (sameParityColumn_eq), and the two cancel to the parity. Hence center t = not (timeParity t XOR interiorDiagonal t)."

[[id]]
id = "interior-aperiodicity"
level = "build"
suite = "register"
statement = "Problem 1 is equivalent to the interior diagonal not being eventually periodic: CenterPeriodic T P gives InteriorPeriodic T (2P) and InteriorPeriodic T P gives CenterPeriodic T (2P), so Problem1 iff InteriorAperiodic."

[[id]]
id = "interior-kernel-reduction"
level = "build"
suite = "register"
statement = "The center is 2-automatic exactly when the interior diagonal is: a finite 2-kernel is closed under negation and under XOR with the time parity, so CenterInfiniteKernel iff not InteriorKernelFinite, and Problem 1 follows if the interior diagonal is not 2-automatic."

[[id]]
id = "characteristic-one-facet"
level = "build"
suite = "register"
statement = "The carry is the intersection of a row with its own translate (the characteristic-1 content of rule 30, the idempotent OR, against the characteristic-2 linear part whose Frobenius is the gasket). On the linear rows the self-intersection is exact: carry (q^(2m)) = 0 and carry (q^(2m+1)) is the run boundary of q^m; the linear self-carry lives on odd rows only."

[[id]]
id = "three-diagonal-band"
level = "build"
suite = "register"
statement = "The three inner diagonals of the regular side (carry bits 2t, 1, 2 of every row) contribute exactly the period-doubling sequence: center t = trailingParity (t-2) XOR interiorThreeDiagonal t for t >= 2, where interiorThreeDiagonal is the gasket parity of the carries on diagonals >= 3. Hence CenterPeriodic T P iff ThreeAgainstTrailing T P (T >= 2) and Problem 1 iff ThreeAperiodic: the deep interior can never be the period-doubling sequence plus a periodic sequence."

[[id]]
id = "stable-kernel"
level = "build"
suite = "register"
statement = "The trinomial kernel is dyadically stable: trinomialParity (2^(j+1)-1-m) d = trinomialParity (2^j-1-m) d for m, d < 2^j, so the dyadic column reads the carries of row m through the fixed kernel stableKernel m (the inverse 1/q^(m+1); row 2^j-1 is 1/q = 110110... below degree 2^j): center (2^j) = not stableFormula j for j >= 1, and DyadicColumnAperiodic iff StableFormulaAperiodic."

[[id]]
id = "dyadic-renormalization"
level = "build"
suite = "register"
statement = "The obligation renormalizes: the ruler trailingParity moves across 2^k P only on the class n = -1 mod 2^k, where it is the ruler one scale up twisted by [k odd]. Under a center period P the deep interior is exactly 2^k P-periodic off the class t = 1 mod 2^k, and on the class the sampled sequence u -> interiorThreeDiagonal (2^k u + 1) satisfies the same equation against the ruler with the same period P, for every k."

[[id]]
id = "scale-free-rows"
level = "build"
suite = "register"
statement = "Each row's contribution to the dyadic column is the same at every scale above the row (rowTerm (2^(j+1)) m = rowTerm (2^j) m for m < 2^j), so the dyadic column is the prefix parity of one fixed sequence dyadicRow and the block response is its block parity: center (2^(j+1)) = center (2^j) XOR blockParity j, wittRespBool (2^j) j = blockParity j. Problem 1 follows if the block parities of dyadicRow are not eventually periodic in j."

[[id]]
id = "left-band"
level = "build"
suite = "register"
statement = "The chaotic-side edge is regular for a few cells (ldiag 2 = 0, ldiag 3 = timeParity, ldiag 4 = 1, ldiag 5 = ldiag 6 = timeParity, ldiag 7 = 0), so the carries on the left diagonals 3..5 are [m odd] for m >= 5 (plus one event at row 3) and contribute not timeParity t XOR trailingParity (t-4) XOR trailingParity ((t-4)/2): for t >= 6, center t = rulerBackground t XOR interiorEightDiagonal t, with both edge bands stripped, and Problem 1 iff EightAperiodic."

[[id]]
id = "kernel-law"
level = "build"
suite = "register"
statement = "The freezing law of the linear transport: for a row m < 2^k and a time 2^k u + r (r < 2^k, u >= 1), rowTerm (2^k u + r) m = frozen k r m XOR trailingParity (u-1) AND second k r m, with frozen and second read off the row's contributions at u = 1 and u = 2. Hence every 2-kernel sequence of the center is explicit up to the rows at or above the scale: center (2^k u + r) = not (timeParity r XOR frozenPrefix k r XOR trailingParity (u-1) AND secondPrefix k r XOR lateTail k r u); the fixed dyadic row, the class renormalization and the band rulers are its instances, and a block of rows [2^j, 2^(j+1)) influences every later time only through its influence on the next two block-spans, modulated by the ruler."

[[id]]
id = "api-modules"
level = "build"
suite = "api"
statement = "The command surface, the register, the architecture and the presentation are LexLean semantic modules on prism-stdlib, verified by the gate."

[[id]]
id = "prism-model"
level = "build"
suite = "api"
statement = "The model registers (authorities, ids, ledger, commands, standards, projection, contracts, errors, dependencies, runtime-roots, stdlib-package), the result schemas, the Gherkin suites and CONFORMANCE.md are generated from the register, the parser, the error table and the architecture, and drift is refused."

[[id]]
id = "rust-emission"
level = "build"
suite = "api"
statement = "The production roots of Api.lex.tex (commands, commandCount) export to certified Rust packages through lexlean production build, kernel-checked under its stated axioms, and the published bundle replays with verify-artifact."

[[id]]
id = "observer"
level = "build"
suite = "api"
statement = "Observer.lex.tex records the object quadruple of every stakeholder vantage (the proof as the real object, the journey as the sensual object, the proved claims its panels render as real qualities, the panels as sensual qualities, the open claims as withdrawn) and the kernel decides withdrawal, nonempty overlap, symmetric interaction and gauge covariance over the register and the presentation."

[[id]]
id = "current-view"
level = "build"
suite = "api"
statement = "The view workflow renders the artifacts Presentation.lex.tex declares, with the site, on every push to main, deploys them to GitHub Pages at the URL Application.lex.tex names, and runs no validation; every journey step is a rendered panel and the page meets WCAG AA contrast with keyboard focus and reduced motion honoured."
