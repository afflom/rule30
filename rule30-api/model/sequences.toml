[[excluded]]
id = "dyadic-row"
lexeme = "r30.observation::dyadic-row"
lean = "Rule30UOR.DyadicRow.dyadicRow"
reason = "dyadicRow m = rowTerm (2^(m+1)) m iterates the linear map phiLinear 2^(m+1) - 1 - m times (Core.phiLinearPow is the plain iteration), so t < 512 needs about 2^512 steps."

[[excluded]]
id = "block-parity"
lexeme = "r30.observation::block-parity"
lean = "Rule30UOR.DyadicRow.blockParity"
reason = "blockParity j reads dyadicRow at 2^j + i for every i < 2^j, so its window is out of reach for the reason dyadic-row is."

[[excluded]]
id = "witt-resp"
lexeme = "r30.witt::witt-resp"
lean = "Rule30UOR.Interfaces.wittRespBool"
reason = "wittRespBool t k is a response in two variables whose value at (t, k) runs the Witt window over 2^k rows; it is a sequence in t only once k is fixed, and no k is singled out by the paper, so it is left out rather than instantiated at an arbitrary scale."
