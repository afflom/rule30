spec = "template/1"

[[claim]]
id = "problem1"
level = "open"
statement = "The center column of Rule 30 from a single black cell is not eventually periodic."
feature = "interfaces/problem1.md"
evidence = "register: open (Ruliology.CellularAutomata.Rule30Prize.Problem1)"

[[claim]]
id = "coupling-law"
level = "build"
statement = "With the center agreeing at t, the next center defect is leftDefect(t,1) XOR ((not center t) AND rightDefect(t,1)); a center period is exactly this coupling at every later time."
feature = "interfaces/coupling-law.md"
evidence = "frontier check: Rule30UOR.WittDefect.center_periodic_of_coupling kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "aperiodic-compensation"
level = "open"
statement = "The bulk carries, with both edge bands stripped (interiorEightDiagonal: diagonals >= 3 on the regular side and >= 6 on the chaotic side), are never the ruler background trailingParity (t-2) XOR not timeParity t XOR trailingParity (t-4) XOR trailingParity ((t-4)/2) plus a periodic sequence: EightAperiodic. Equivalent to Problem 1 (left-band), to ThreeAperiodic (three-diagonal-band) and to InteriorAperiodic (interior-aperiodicity). This is the remaining obligation."
feature = "interfaces/aperiodic-compensation.md"
evidence = "register: open (Rule30UOR.LeftBand.EightAperiodic)"

[[claim]]
id = "q-adic-descent"
level = "some-true"
statement = "The q-adic order of the observer defect carries a descent quantity."
feature = "interfaces/q-adic-descent.md"
evidence = "register: refuted (Rule30UOR.WittDefect.observer_front_q_rank)"

[[claim]]
id = "front-slack-descent"
level = "some-true"
statement = "Phi_t = R_t - k_t (q-rank minus front depth) is a non-increasing potential."
feature = "interfaces/front-slack-descent.md"
evidence = "register: refuted"

[[claim]]
id = "evaluation-point"
level = "some-true"
statement = "Evaluating the observer polynomial at a constant point (0, 1, omega, omega^2) constrains the center."
feature = "interfaces/evaluation-point.md"
evidence = "register: refuted"

[[claim]]
id = "gate-phase-opposition"
level = "some-true"
statement = "At a coupled arrival the gate phase is the negative of centerSign * rightPhase(start, 2)."
feature = "interfaces/gate-phase-opposition.md"
evidence = "register: refuted (Rule30UOR.WittDefect.head_import_path_rejects_negative_gate)"

[[claim]]
id = "band-engines"
level = "some-true"
statement = "The lhBandAgree / prefix-tail / late-scale engine hypothesis bundles refute a periodic center."
feature = "interfaces/band-engines.md"
evidence = "register: refuted (Rule30UOR.Interfaces.lhBandAgree_engine_hypotheses_unsat)"

[[claim]]
id = "recurrent-central-collision"
level = "build"
statement = "Problem 1 is equivalent to: under every hypothetical center period, central collisions do not occur arbitrarily late in the band of width 2P."
feature = "interfaces/recurrent-central-collision.md"
evidence = "frontier check: Rule30UOR.CentralCollision.problem1_iff_no_recurrent_central_collision kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "saturation-reexcitation"
level = "some-true"
statement = "Under a periodic center, each front arrival injects a unit boundary bit that re-excites the observer polynomial, so the center cannot settle (the RF/photonics heat-death reading)."
feature = "interfaces/saturation-reexcitation.md"
evidence = "register: refuted (Rule30UOR.WittDefect.periodic_arrival_no_crossing)"

[[claim]]
id = "horizon-criterion"
level = "open"
statement = "For every T and P > 0 there is an explicit horizon H(T, P) such that CenterPeriodic T P already fails on the window [T, T + H(T, P)]: a flip forced by the doubling zero diagonal of P reaches column -1 inside the window while the gated mirror forbids it there."
feature = "interfaces/horizon-criterion.md"
evidence = "register: open"

[[claim]]
id = "horizon-certificate"
level = "build"
statement = "For every transient T ≤ 512 and period 0 < P ≤ 128 the center disagrees with its lag-P shift at a time in [T, T + 32): the horizon H = 32 is a kernel-checked certificate on these ranges."
feature = "interfaces/horizon-certificate.md"
evidence = "frontier check: Rule30UOR.Horizon.horizon_thirty_two kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "left-defect-sourcing"
level = "build"
statement = "Under a periodic center, a left defect at depth k at time t is sourced by a right column-one defect at a time in [t, t + k); equivalently column-one agreement on [t, t + k) forces the whole left cone of depth k at t to agree."
feature = "interfaces/left-defect-sourcing.md"
evidence = "frontier check: Rule30UOR.LeftCone.left_defect_sourced kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "first-failure-2adic"
level = "some-true"
statement = "The first time a hypothetical center period (T, P) fails is governed by the 2-adic data of P and T (the scale mismatch between the periodically seeded right half and the doubling-time reconstruction of the left edge), so the closing invariant can be read off the first failing comparison."
feature = "interfaces/first-failure-2adic.md"
evidence = "register: refuted"

[[claim]]
id = "ledger-diagonal"
level = "build"
statement = "The center column is the complement of the diagonal of the carry ledger: center t = not (bit t of winWitt 0 t), because row t = q^t XOR ledger and the central trinomial coefficient of q^t is odd; hence a center period is exactly a period of the ledger diagonal."
feature = "interfaces/ledger-diagonal.md"
evidence = "frontier check: Rule30UOR.Ledger.centerPeriodic_iff_ledgerPeriodic kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "periodic-finite-kernel"
level = "build"
statement = "A periodic center has a finite 2-kernel: under CenterPeriodic T P every subsequence t -> center(2^k t + r), r < 2^k, is one of an explicit finite family (the kernel subsequences with 2^k < T + P, and t -> if t = 0 then b else center(T + (u t + v) mod P) with u, v < P)."
feature = "interfaces/periodic-finite-kernel.md"
evidence = "frontier check: Rule30UOR.Automatic.centerKernelFinite_of_centerPeriodic kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "center-infinite-kernel"
level = "open"
statement = "The center column is not 2-automatic: its 2-kernel, the family of subsequences t -> center(2^k t + r) with r < 2^k, is infinite. By Christol this is the transcendence of the series sum center(t) y^t over F_2(y); by Rowland-Yassawi it says the center is not a column of any linear cellular automaton over F_2."
feature = "interfaces/center-infinite-kernel.md"
evidence = "register: open"

[[claim]]
id = "kernel-self-similarity"
level = "build"
statement = "A finite 2-kernel forces a dyadic self-similarity of the center: some k < k' with center(2^k' t) = center(2^k t) for all t (pigeonhole along the zero path of the kernel tree); hence Problem 1 follows from NoDyadicSelfSimilarity."
feature = "interfaces/kernel-self-similarity.md"
evidence = "frontier check: Rule30UOR.Automatic.problem1_of_no_dyadic_self_similarity kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "no-dyadic-self-similarity"
level = "open"
statement = "For all k < k' there is a time t with center(2^k' t) != center(2^k t): the center column is not self-similar under any dyadic dilation."
feature = "interfaces/no-dyadic-self-similarity.md"
evidence = "register: open (Rule30UOR.Automatic.NoDyadicSelfSimilarity)"

[[claim]]
id = "dilation-reduction"
level = "build"
statement = "A finite 2-kernel makes every dilation sequence j -> center(2^j t) eventually periodic with one common period; hence Problem 1 follows if a single dilation sequence, in particular the dyadic column j -> center(2^j), is not eventually periodic."
feature = "interfaces/dilation-reduction.md"
evidence = "frontier check: Rule30UOR.Automatic.problem1_of_dyadic_column_aperiodic kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "dyadic-column-aperiodic"
level = "open"
statement = "The dyadic column j -> center(2^j) is not eventually periodic."
feature = "interfaces/dyadic-column-aperiodic.md"
evidence = "register: open (Rule30UOR.Automatic.DyadicColumnAperiodic)"

[[claim]]
id = "base-generic-reduction"
level = "build"
statement = "For every base b >= 2 and every t, Problem 1 follows if the b-dilation sequence j -> center(b^j t) is not eventually periodic: a periodic center has a finite b-kernel, a finite b-kernel forces a b-adic self-similarity, and that makes every b-dilation sequence eventually periodic."
feature = "interfaces/base-generic-reduction.md"
evidence = "frontier check: Rule30UOR.Automatic.problem1_of_dilation_aperiodic_in_paper kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "some-base-dilation-aperiodic"
level = "open"
statement = "There are a base b >= 2 and a time t such that the dilation sequence j -> center(b^j t) is not eventually periodic."
feature = "interfaces/some-base-dilation-aperiodic.md"
evidence = "register: open"

[[claim]]
id = "kappa-collapse"
level = "build"
statement = "kappa-collapse at scale K (every cone window response at scales >= K vanishes, i.e. the carries no longer reach the center) is exactly a center period 2^K from time 0; the horizon certificate refutes it for K <= 7, and Problem 1 is equivalent to no kappa-collapse at any scale together with no period that is not a power of two."
feature = "interfaces/kappa-collapse.md"
evidence = "frontier check: Rule30UOR.Automatic.kappaCollapse_iff kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "dyadic-response-reduction"
level = "build"
statement = "At time 2^j the right cell at distance 2^j is the black edge, so center(2^(j+1)) = not center(2^j) XOR response(2^j, j); hence Problem 1 follows if the responses on the dyadic diagonal, j -> response(2^j, j), are not eventually periodic."
feature = "interfaces/dyadic-response-reduction.md"
evidence = "frontier check: Rule30UOR.Automatic.problem1_of_dyadic_response_aperiodic kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "dyadic-response-aperiodic"
level = "open"
statement = "The responses on the dyadic diagonal, j -> response(2^j, j) (the window [2^j, 2^(j+1)) read at the center), are not eventually periodic."
feature = "interfaces/dyadic-response-aperiodic.md"
evidence = "register: open (Rule30UOR.Automatic.DyadicResponseAperiodic)"

[[claim]]
id = "all-rules-facet"
level = "build"
statement = "Every elementary rule has a unique algebraic normal form over F_2 (decided for all 256 codes), every normal form is its linear part XOR its nonlinear part, and Rule 30 is the unique code with normal form a XOR b XOR c XOR bc: the ledger decomposition is coherent across all rules, and the solution is a property of the single carry monomial bc under the linear part 1 + X + X^2."
feature = "interfaces/all-rules-facet.md"
evidence = "frontier check: Rule30UOR.Rules.rule_eq_linear_xor_carry kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "edge-interior-split"
level = "build"
statement = "Two carry events of every row are explicit (the left edge pair and the right pair at the right edge); removing them splits the ledger by linearity into an edge-sourced ledger, the Rule-150 evolution of a periodic source, and the ledger of the interior carries, and center t = not (edgeDiagonal t XOR interiorDiagonal t)."
feature = "interfaces/edge-interior-split.md"
evidence = "frontier check: Rule30UOR.EdgeSplit.center_eq_not_bxor_diagonals kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "edge-diagonal-formula"
level = "build"
statement = "The edge diagonal is an explicit 2-automatic expression: edgeLedger t is the Rule-150 propagation of the edge events, so edgeDiagonal t = edgeFormula t t, the XOR over m < t of trinomialParity (t-1-m) (t-2m-1) XOR [rdiag 1 m] trinomialParity (t-1-m) (t-2); hence center t = not (edgeFormula t t XOR interiorDiagonal t)."
feature = "interfaces/edge-diagonal-formula.md"
evidence = "frontier check: Rule30UOR.EdgeSplit.center_eq_not_formula_xor_interior kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "interior-diagonal-formula"
level = "build"
statement = "Bit t of q^n times y is the convolution of the bits of y with the trinomial row (testBit_phiLinearPow_conv), so the interior diagonal is the explicit XOR over the rows m < t of the convolution of row m's interior carries with trinomialParity (t-1-m), and center t = not (edgeFormula t t XOR interiorFormula t t): the center is fully explicit in the carries."
feature = "interfaces/interior-diagonal-formula.md"
evidence = "frontier check: Rule30UOR.EdgeSplit.center_eq_not_formulas kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "route-a-band-discharge"
level = "some-true"
statement = "Route A (dyadic reflection): discharge the single-row spatial-agreement hypothesis of the terminal refutations 9.1496-9.1516 under a periodic center with Q = c 2^K P and K large, so that lhBandAgree(z+p+1, Q, 1, S) with S >= p + 3Q follows and the terminal theorems close Problem 1."
feature = "interfaces/route-a-band-discharge.md"
evidence = "register: refuted (Rule30UOR.Interfaces.lhBandAgree_engine_hypotheses_unsat)"

[[claim]]
id = "route-c-rank-drop"
level = "some-true"
statement = "Route C (cyclotomic rank drop): link the carry-ledger congruences modulo q^(2^a) and the page charge to show the observer source flux cannot supply the q-divisibility needed to keep the q-rank non-negative as t grows, closing Problem 1."
feature = "interfaces/route-c-rank-drop.md"
evidence = "register: refuted (Rule30UOR.WittDefect.observer_front_q_rank)"

[[claim]]
id = "route-b-reset-mismatch"
level = "some-true"
statement = "Route B (reset flux jump): between the doubling diagonal z+1 at time t and the reset diagonal z+3 at time t+1, which share the arrival time 2t-z-2 and hence the same import balance, the sum diagonalPhase + diagonalFlux changes by a unit, contradicting periodic_diagonal_import_balance and closing Problem 1."
feature = "interfaces/route-b-reset-mismatch.md"
evidence = "register: refuted (Rule30UOR.Routes.diagonal_reset_sum_invariant)"

[[claim]]
id = "edge-parity"
level = "build"
statement = "The edge background of the center is the time parity: edgeDiagonal t = timeParity t, i.e. t mod 2. The column parity of the trinomial triangle is Thue-Morse shifted by one (columnParity (2e+1) = columnParity e, columnParity (2e+2) = not columnParity e, from trinomialParity n n = true), the right-pair part is the same sequence read at (t-2)/2 (sameParityColumn_eq), and the two cancel to the parity. Hence center t = not (timeParity t XOR interiorDiagonal t)."
feature = "interfaces/edge-parity.md"
evidence = "frontier check: Rule30UOR.EdgeParity.edgeDiagonal_eq_timeParity kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "interior-aperiodicity"
level = "build"
statement = "Problem 1 is equivalent to the interior diagonal not being eventually periodic: CenterPeriodic T P gives InteriorPeriodic T (2P) and InteriorPeriodic T P gives CenterPeriodic T (2P), so Problem1 iff InteriorAperiodic."
feature = "interfaces/interior-aperiodicity.md"
evidence = "frontier check: Rule30UOR.EdgeParity.problem1_iff_interiorAperiodic kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "interior-kernel-reduction"
level = "build"
statement = "The center is 2-automatic exactly when the interior diagonal is: a finite 2-kernel is closed under negation and under XOR with the time parity, so CenterInfiniteKernel iff not InteriorKernelFinite, and Problem 1 follows if the interior diagonal is not 2-automatic."
feature = "interfaces/interior-kernel-reduction.md"
evidence = "frontier check: Rule30UOR.KernelParity.centerInfiniteKernel_iff_interior kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "characteristic-one-facet"
level = "build"
statement = "The carry is the intersection of a row with its own translate (the characteristic-1 content of rule 30, the idempotent OR, against the characteristic-2 linear part whose Frobenius is the gasket). On the linear rows the self-intersection is exact: carry (q^(2m)) = 0 and carry (q^(2m+1)) is the run boundary of q^m; the linear self-carry lives on odd rows only."
feature = "interfaces/characteristic-one-facet.md"
evidence = "frontier check: Rule30UOR.Intersection.linear_self_intersection_even kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "three-diagonal-band"
level = "build"
statement = "The three inner diagonals of the regular side (carry bits 2t, 1, 2 of every row) contribute exactly the period-doubling sequence: center t = trailingParity (t-2) XOR interiorThreeDiagonal t for t >= 2, where interiorThreeDiagonal is the gasket parity of the carries on diagonals >= 3. Hence CenterPeriodic T P iff ThreeAgainstTrailing T P (T >= 2) and Problem 1 iff ThreeAperiodic: the deep interior can never be the period-doubling sequence plus a periodic sequence."
feature = "interfaces/three-diagonal-band.md"
evidence = "frontier check: Rule30UOR.Band.center_eq_trailingParity_bxor_three kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "stable-kernel"
level = "build"
statement = "The trinomial kernel is dyadically stable: trinomialParity (2^(j+1)-1-m) d = trinomialParity (2^j-1-m) d for m, d < 2^j, so the dyadic column reads the carries of row m through the fixed kernel stableKernel m (the inverse 1/q^(m+1); row 2^j-1 is 1/q = 110110... below degree 2^j): center (2^j) = not stableFormula j for j >= 1, and DyadicColumnAperiodic iff StableFormulaAperiodic."
feature = "interfaces/stable-kernel.md"
evidence = "frontier check: Rule30UOR.StableKernel.dyadicColumnAperiodic_iff_stable kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "dyadic-renormalization"
level = "build"
statement = "The obligation renormalizes: the ruler trailingParity moves across 2^k P only on the class n = -1 mod 2^k, where it is the ruler one scale up twisted by [k odd]. Under a center period P the deep interior is exactly 2^k P-periodic off the class t = 1 mod 2^k, and on the class the sampled sequence u -> interiorThreeDiagonal (2^k u + 1) satisfies the same equation against the ruler with the same period P, for every k."
feature = "interfaces/dyadic-renormalization.md"
evidence = "frontier check: Rule30UOR.Band.threeClass_of_centerPeriodic kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "scale-free-rows"
level = "build"
statement = "Each row's contribution to the dyadic column is the same at every scale above the row (rowTerm (2^(j+1)) m = rowTerm (2^j) m for m < 2^j), so the dyadic column is the prefix parity of one fixed sequence dyadicRow and the block response is its block parity: center (2^(j+1)) = center (2^j) XOR blockParity j, wittRespBool (2^j) j = blockParity j. Problem 1 follows if the block parities of dyadicRow are not eventually periodic in j."
feature = "interfaces/scale-free-rows.md"
evidence = "frontier check: Rule30UOR.DyadicRow.center_twopow_succ_eq kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "left-band"
level = "build"
statement = "The chaotic-side edge is regular for a few cells (ldiag 2 = 0, ldiag 3 = timeParity, ldiag 4 = 1, ldiag 5 = ldiag 6 = timeParity, ldiag 7 = 0), so the carries on the left diagonals 3..5 are [m odd] for m >= 5 (plus one event at row 3) and contribute not timeParity t XOR trailingParity (t-4) XOR trailingParity ((t-4)/2): for t >= 6, center t = rulerBackground t XOR interiorEightDiagonal t, with both edge bands stripped, and Problem 1 iff EightAperiodic."
feature = "interfaces/left-band.md"
evidence = "frontier check: Rule30UOR.LeftBand.center_eq_rulerBackground_bxor_eight kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "kernel-law"
level = "build"
statement = "The freezing law of the linear transport: for a row m < 2^k and a time 2^k u + r (r < 2^k, u >= 1), rowTerm (2^k u + r) m = frozen k r m XOR trailingParity (u-1) AND second k r m, with frozen and second read off the row's contributions at u = 1 and u = 2. Hence every 2-kernel sequence of the center is explicit up to the rows at or above the scale: center (2^k u + r) = not (timeParity r XOR frozenPrefix k r XOR trailingParity (u-1) AND secondPrefix k r XOR lateTail k r u); the fixed dyadic row, the class renormalization and the band rulers are its instances, and a block of rows [2^j, 2^(j+1)) influences every later time only through its influence on the next two block-spans, modulated by the ruler."
feature = "interfaces/kernel-law.md"
evidence = "frontier check: Rule30UOR.KernelLaw.rowTerm_kernel_law kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "residue-dichotomy"
level = "build"
statement = "At every dyadic scale k >= 3 the ruler background moves with the scale index u only on the residues r = 1 and r = 2: rulerBackground (2^k u + r) = rulerBackground (2^k + r) XOR trailingParity (u-1) AND [r in {1,2}] (at r = 3 the two rulers cancel). Hence under a center period the deep bulk interiorEightDiagonal is P-periodic in u on every residue class except 1 and 2, where it tracks the ruler; and the late tail of the kernel law carries the ruler difference exactly on the residues where the frozen rows' second table is set."
feature = "interfaces/residue-dichotomy.md"
evidence = "frontier check: Rule30UOR.ClassObligation.eightOffClass_of_centerPeriodic kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "second-table"
level = "build"
statement = "The frozen rows' second table is exact on the first four residues: second k 2 m = false for every row, and second k 3 m = pairRow m (the rows carrying the diagonal-2 pair, m odd and m >= 3), so secondPrefix k 2 = false and secondPrefix k 3 = true for every k >= 2. With secondPrefix k 0 = secondPrefix k 1 = false, the late tail of the kernel law is P-periodic in u on residues 0, 1, 2 and carries the ruler difference on residue 3, at every scale; and the residue-1 late tail at the first index is the single bit center (2^k) AND cell (2^k) 1."
feature = "interfaces/second-table.md"
evidence = "frontier check: Rule30UOR.ClassObligation.secondPrefix_three kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "antidiagonal"
level = "build"
statement = "The right half-plane is a tower of words: every right diagonal rdiag j is exactly 2^j-periodic from time 0 (Right.rdiag_periodic), so it is a word towerWord j of length 2^j; the tower is generated from the two constant words (true, and the time parity) by the permutive recursion read from the right edge, towerWord (k+2) (s+1) = towerWord (k+2) s XOR (towerWord (k+1) s OR towerWord k s); and the center is its anti-diagonal, center t = towerWord t t. Problem 1 iff AntidiagonalAperiodic: the anti-diagonal of the tower is not eventually periodic. The formulation with no free input: two constant words, one local recursion, one diagonal read."
feature = "interfaces/antidiagonal.md"
evidence = "frontier check: Rule30UOR.Antidiagonal.problem1_iff_antidiagonal kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "diagonal-halving"
level = "build"
statement = "Every right diagonal rdiag j with j >= 2 has period 2^(j-1), half of Jen's 2^j: the OR-word of two words with periods 2^k and 2^(k+1) has period 2^(k+1), so its weight over 2^(k+2) is the parity of two equal halves, even, and the next word's second half equals its first; from the bases 2 and 3 the two-step induction gives every j. Hence wordWeight k = false for every k: the doubling of Jen's law never exceeds 2^(j-1)."
feature = "interfaces/diagonal-halving.md"
evidence = "frontier check: Rule30UOR.Antidiagonal.rdiag_period_half kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "mask-transport"
level = "build"
statement = "The tower unfolds: the OR of the recursion splits as the previous word plus the exposed part of the word before it (a black cell whose left neighbour is white, the left end of a black run), so every word is the iterated prefix parity of the time parity plus the transport of the exposed masks, and at the anti-diagonal the linear part is C(t,t) = 1: center t = not maskTransport (t-2) t, the exact dual of center = not ledgerDiagonal, with Pascal weights in diagonal coordinates where the carry ledger has trinomial weights in time coordinates."
feature = "interfaces/mask-transport.md"
evidence = "frontier check: Rule30UOR.Antidiagonal.center_eq_not_maskTransport kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "lucas-frame"
level = "build"
statement = "The dual transport's weights are the binomial parities: the n-fold prefix parity has weights C(s-1-j, n-1) mod 2, mechanized as pascalParity by the digit recursion (Lucas: Pascal's rule, C(n,n) = 1, zero above the diagonal, the hockey stick), so the linear part of the tower is C(s, n+1) mod 2 and center t = not lucasSum (t-2) t, a Lucas-weighted sum of the left run-ends of the right diagonals. In this frame an early diagonal contributes only through its corner of times j <= i+1, a recent diagonal its whole history with sparse weights, and the frame's freezing law is Lucas's higher-bit independence with no ruler side-terms."
feature = "interfaces/lucas-frame.md"
evidence = "frontier check: Rule30UOR.Antidiagonal.center_eq_lucas kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "left-light-cone"
level = "build"
statement = "The center is the complement of the Pascal transport of the left run-ends: center t = not leftCone t, with leftCone t the XOR over times j < t and distances q of C(t-1-j, q) mod 2 times the run-end indicator cell j (1-q) AND NOT cell j (-q), sourced only from positions <= 1. The weight is the binomial parity of the age and the distance from column +1, and it obeys Lucas's higher-bit law (an age change by a multiple of 2^m leaves the weight of every distance below 2^m unchanged)."
feature = "interfaces/left-light-cone.md"
evidence = "frontier check: Rule30UOR.Antidiagonal.center_eq_leftCone kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "left-tower"
level = "build"
statement = "Every left diagonal is eventually periodic: in left-diagonal coordinates the rule makes diagonal j+2 a one-bit state driven by diagonals j and j+1, one input period acts on the state as a map on Bool whose third iterate equals the first, so periodic inputs give a periodic diagonal with twice the period after one more period; from the constant edge diagonals, diagonal j has period 2^j from time 2^j. With the right table (exactly periodic from time 0, period 2^(j-1)), the center is the anti-diagonal of both tables, read where neither has settled."
feature = "interfaces/left-tower.md"
evidence = "frontier check: Rule30UOR.LeftTower.ldiag_eventually_periodic kernel-checked under propext and Quot.sound and published"

[[claim]]
id = "jen-law"
level = "build"
statement = "Jen's law in exact form: if q is a period of the OR-word below, a right diagonal word satisfies W_j(s+q) = W_j(s) XOR W_j(q), so its period is q or 2q according to the single doubling bit W_j(q); the exponent jenExp (k+2) = jenExp (k+1) + [W_{k+2}(2^jenExp(k+1))] is non-decreasing with steps 0 or 1 and every word has period 2^jenExp j. The center reads the same word at position t (its prefix parity over [0,t)), the period structure at position 2^jenExp(j-1) (over one full period)."
feature = "interfaces/jen-law.md"
evidence = "frontier check: Rule30UOR.RightPeriods.towerWord_jen_periodic kernel-checked under propext and Quot.sound and published"

