spec = "prismpm/errors/1"

[[error]]
code = "R301001"
title = "Unknown claim"
class = "register"
exit = 2
statement = "A command names a claim id that is not in frontier.toml."
commands = ["claim", "interface"]

[[error]]
code = "R301002"
title = "Register inconsistent with the kernel"
class = "register"
exit = 1
statement = "A proved claim lacks a kernel-checked Lean theorem under propext and Quot.sound or a published lexeme, a refuted claim names no refutation, a claim depends on an unknown claim, or the rendered Frontier module is stale."
commands = ["frontier_check"]

[[error]]
code = "R301003"
title = "Register edit refused"
class = "register"
exit = 2
statement = "frontier add or set names a status outside open, proved, refuted and retired, adds an id that exists, or sets one that does not."
commands = ["frontier_add", "frontier_set"]

[[error]]
code = "R302001"
title = "Unknown lexeme"
class = "lexicon"
exit = 2
statement = "lexicon show names neither a lexeme id nor the Lean name of a published lexeme."
commands = ["lexicon_show"]

[[error]]
code = "R302002"
title = "Statement not expressible in LexLean"
class = "converter"
exit = 2
statement = "The Lean declaration cannot be stated on the first-order surface: an implicit binder, a cast, Bool.xor instead of bxor, 2 ^ k instead of twopow k, a lexeme not visible from the target lexicon, or a function-typed argument. Fix the Lean statement, not the entry."
commands = ["theorem_preview", "theorem_add", "probe"]

[[error]]
code = "R302003"
title = "Unpublish refused"
class = "lexicon"
exit = 2
statement = "theorem remove names a lexeme that is not a published proof constant of this project or whose statement block cannot be located."
commands = ["theorem_remove"]

[[error]]
code = "R303001"
title = "LexLean check failed"
class = "lexlean"
exit = 1
statement = "lexlean check reported a diagnostic for a module of the selected project, or a lexlean lock refused a project after a command rewrote it (api sync, consolidate, frontier add or set, discover --write)."
commands = ["check", "api_sync", "consolidate", "frontier_add", "frontier_set", "discover"]

[[error]]
code = "R303002"
title = "LexLean verify failed"
class = "lexlean"
exit = 1
statement = "lexlean verify produced no attestation for the selected project or modules."
commands = ["verify"]

[[error]]
code = "R303003"
title = "API drifted from its sources"
class = "lexlean"
exit = 1
statement = "A generated module, register, schema, feature, conformance document or the logo of rule30-api differs from what its sources render; run bin/r30 api sync."
commands = ["api_check"]

[[error]]
code = "R304001"
title = "Probe failed"
class = "kernel"
exit = 1
statement = "The elaboration probe of a prepared statement (the same Lean that lexlean verify runs) reported errors."
commands = ["probe"]

[[error]]
code = "R304002"
title = "Axiom beyond propext and Quot.sound"
class = "kernel"
exit = 1
statement = "A named theorem is unknown to Lean or depends on an axiom other than propext and Quot.sound."
commands = ["axioms"]

[[error]]
code = "R304003"
title = "Theorem depends on Classical.choice"
class = "kernel"
exit = 1
statement = "At least one theorem under the given prefixes depends on Classical.choice."
commands = ["choice_audit"]

[[error]]
code = "R304004"
title = "Lean cannot answer"
class = "kernel"
exit = 1
statement = "The query to the built research library failed: the library is not built, a module is missing, or Lean reported an error."
commands = ["claim", "sig", "mentions", "interface", "frontier_render", "frontier_add", "frontier_set", "unpublished", "selfcheck", "define", "kappa", "consolidate"]

[[error]]
code = "R305001"
title = "Gate already running"
class = "gate"
exit = 2
statement = "A pre-commit gate started from this checkout is still running; wait for it (bin/r30 gate)."
commands = ["commit"]

[[error]]
code = "R305002"
title = "Module registration refused"
class = "workspace"
exit = 2
statement = "module add names a module that is not a valid Rule30UOR module name or whose Lake workspace files are absent."
commands = ["module_add"]

[[error]]
code = "R305003"
title = "Lake build failed"
class = "workspace"
exit = 1
statement = "lake build of the named research modules reported errors."
commands = ["module_add", "module_build", "consolidate"]

[[error]]
code = "R305004"
title = "Experiment failed"
class = "experiment"
exit = 1
statement = "The experiment script exited with a nonzero status; its output precedes the failure."
commands = ["experiment_run"]

[[error]]
code = "R305005"
title = "Unknown module"
class = "workspace"
exit = 2
statement = "kappa names a module that is not a registered Rule30UOR research module."
commands = ["kappa"]

[[error]]
code = "R305006"
title = "Staging failed"
class = "workspace"
exit = 1
statement = "git add refused the paths given to commit (a path that neither exists nor is tracked); nothing was committed."
commands = ["commit"]

[[error]]
code = "R308001"
title = "Audit cannot read the library"
class = "audit"
exit = 1
statement = "The audit's Lean introspection of the research library failed (the library is not built, a module is missing, or Lean reported an error), or audit --cached found no recorded audit; consolidate reports it when re-auditing the rebuilt library fails."
commands = ["audit", "consolidate"]

[[error]]
code = "R308002"
title = "Audit record refused"
class = "audit"
exit = 1
statement = "audit --write found data Audit.lex.tex would not decide: a dead conditional refutation without a refuting theorem, a status outside dead, live-discharged and open, or a repeated theorem name; nothing was written."
commands = ["audit"]

[[error]]
code = "R306001"
title = "Production export failed"
class = "production"
exit = 1
statement = "lexlean production build refused the request or the project: a malformed request, a root that is not a production root, an unregistered target digest, a stale lock, an ineligible closure, or a failed certificate."
commands = ["api_production"]

[[error]]
code = "R306002"
title = "Production bundle replay failed"
class = "production"
exit = 1
statement = "lexlean production verify-artifact found a disagreement between the published bundle's parts."
commands = ["api_production"]

[[error]]
code = "R307001"
title = "Sequence evaluation failed"
class = "discovery"
exit = 1
statement = "Lean refused the evaluation program of the basis (an evaluation form not proved equal to its host constant, an error, a timeout) or printed no window of the requested length; nothing was written."
commands = ["sequences"]

[[error]]
code = "R307002"
title = "Basis data inconsistent"
class = "discovery"
exit = 1
statement = "model/sequences.toml is missing, is not the basis sequencemodel declares, carries a κ-label that is not the label of its entry, or a window that is not N bits in 32-bit words; run bin/r30 sequences --write."
commands = ["sequences", "discover"]

[[error]]
code = "R307003"
title = "Discovery refused"
class = "discovery"
exit = 1
statement = "The relation or recurrence engine returned a contract violation (a precondition the window fails, or an output the postcondition validator refuses), the discovery window does not fit the stored window, or the certified runtime failed to build or run."
commands = ["discover"]

[[error]]
code = "R305007"
title = "Gate refused the commit"
class = "gate"
exit = 1
statement = "commit --wait ran the pre-commit gate in the foreground and the gate refused the staged tree; the log names the stage, nothing was committed."
commands = ["commit"]

[[error]]
code = "R309001"
title = "Deduction cannot run"
class = "deduction"
exit = 1
statement = "deduce could not complete: the basis or the register cannot be read, Lean did not answer the library-facts query, the Deduced module did not build with the accepted theorems (they were dropped), or an accepted theorem cannot be published."
commands = ["deduce"]

[[error]]
code = "R309002"
title = "Not an observed claim"
class = "deduction"
exit = 2
statement = "deduce --claims names a claim that is not in the register with status observed."
commands = ["deduce"]

[[error]]
code = "R309003"
title = "Engine tick failed"
class = "engine"
exit = 1
statement = "A stage of engine tick failed (the build, induction, pruning, deduction or learning), the pre-commit gate refused the tick's commit, or the remote rejected the push while main had not moved (a branch rule GITHUB_TOKEN cannot pass); the ledger records the stage, its seconds and the reason."
commands = ["engine_tick"]

[[error]]
code = "R309004"
title = "Tick refused"
class = "engine"
exit = 2
statement = "engine tick refused to start: the working tree is not clean (a tick starts from a clean checkout of main), or --push was given without --commit."
commands = ["engine_tick"]
