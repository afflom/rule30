spec = "lexlean/project/1"
name = "rule30-api"
language = "1.2"
module_prefix = "Rule30Api"
source_roots = ["src", "stdlib"]
entrypoints = ["src/Api.lex.tex", "src/Discovery.lex.tex", "src/Engine.lex.tex", "src/Hypotheses.lex.tex", "src/Rule30Core.lex.tex"]
build_root = ".lexlean"
lockfile = "engine.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "lexlean.std.bool"
kind = "builtin"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[lexicon_source]]
package = "prism.arch"
kind = "path"
path = "language/prism.arch"

[[lexicon_source]]
package = "prism.qual"
kind = "path"
path = "language/prism.qual"

[[source_package]]
package = "std"
version = "1.0.0"
kind = "path"
path = "lexlean-stdlib"

[limits]
max_file_bytes = 16777216
max_total_source_bytes = 100663296
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 16777216
child_timeout_ms = 600000
