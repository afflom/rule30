spec = "lexlean/project/1"
name = "rule30-native-acceptance-fixture"
language = "1.2"
module_prefix = "Rule30UOR"
source_roots = ["src"]
entrypoints = ["src/NativeAcceptanceFixture.lex.tex"]
build_root = ".lexlean/acceptance-fixture"
lockfile = "native-acceptance-fixture.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "lexlean.std.bool"
kind = "builtin"

[limits]
max_file_bytes = 16777216
max_total_source_bytes = 134217728
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 33554432
child_timeout_ms = 600000
