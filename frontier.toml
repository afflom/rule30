[[claim]]
id = "problem1"
status = "open"
statement = "The center column of Rule 30 from a single black cell is not eventually periodic."
lean = "Ruliology.CellularAutomata.Rule30Prize.Problem1"
lexeme = "r30.joint::problem-one"
since = "2026-10-25"
note = "Root claim. Every other claim is a reduction, an obstruction, or a refuted route."

[[claim]]
id = "coupling-law"
status = "proved"
statement = "With the center agreeing at t, the next center defect is leftDefect(t,1) XOR ((not center t) AND rightDefect(t,1)); a center period is exactly this coupling at every later time."
lean = "Rule30UOR.WittDefect.center_periodic_of_coupling"
lexeme = "r30.observation::center-periodic-of-coupling"
since = "2026-10-30"
note = "Published as center-defect-coupling (the step) and center-periodic-of-coupling (the converse); the iff center_periodic_iff_coupling is host Lean only because LexLean cannot state a quantifier inside an iff. Exact restatement of the lag-P fixed-point difference, not a refutation."
depends = ["problem1"]

[[claim]]
id = "aperiodic-compensation"
status = "open"
statement = "The bulk carries, with both edge bands stripped (interiorEightDiagonal: diagonals >= 3 on the regular side and >= 6 on the chaotic side), are never the ruler background trailingParity (t-2) XOR not timeParity t XOR trailingParity (t-4) XOR trailingParity ((t-4)/2) plus a periodic sequence: EightAperiodic. Equivalent to Problem 1 (left-band), to ThreeAperiodic (three-diagonal-band) and to InteriorAperiodic (interior-aperiodicity). This is the remaining obligation."
lean = "Rule30UOR.LeftBand.EightAperiodic"
since = "2026-10-28"
note = "Every proved reduction ends here. Exact forms: center t = trailingParity (t-2) XOR interiorThreeDiagonal t (t >= 2) and center t = rulerBackground t XOR interiorEightDiagonal t (t >= 6). Under a center period the deep interior has no eventual period at all (not_threePeriodic_of_centerPeriodic) and the obligation renormalizes with the same period on every dyadic class (dyadic-renormalization). Dyadic form: center (2^j) = not prefix parity of the fixed sequence dyadicRow (scale-free-rows); Problem 1 follows if its block parities are not eventually periodic. Black-center absorption remains the constraint at black-center times. Shape fixed by left-defect-sourcing. first-failure-2adic (refuted): the obstruction is exact, not statistical. Routes A, B, C refuted by the kernel (Rule30UOR.Routes). Measured non-routes: diagonals 3..15 of the regular side contribute non-periodic automatic sequences singly and cumulatively; the linear self-carry diagonal is a nontrivial automatic sequence. No closing argument is known."
depends = ["recurrent-central-collision", "coupling-law"]

