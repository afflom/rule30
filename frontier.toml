note = "Rule30UOR.Automatic: dyadic_self_similar_of_kernel2Finite (constructive pigeonhole on the listed family), centerInfiniteKernel_of_no_dyadic_self_similarity, problem1_of_no_dyadic_self_similarity."
depends = ["periodic-finite-kernel"]

[[claim]]
