# The research frontier. Edit with `r30 frontier`; see STRATEGY.md for the prose.

[[claim]]
id = "problem1"
status = "open"
statement = "The center column of Rule 30 from a single black cell is not eventually periodic."
lean = "Ruliology.CellularAutomata.Rule30Prize.Problem1"
lexeme = "r30.joint::problem-one"
since = "2026-10-25"
note = "Root claim. Every other claim is a reduction, an obstruction, or a refuted route."

[[claim]]
id = "coupling-law"
status = "proved"
statement = "With the center agreeing at t, the next center defect is leftDefect(t,1) XOR ((not center t) AND rightDefect(t,1)); a center period is exactly this coupling at every later time."
lean = "Rule30UOR.WittDefect.center_periodic_of_coupling"
lexeme = "r30.observation::center-periodic-of-coupling"
since = "2026-10-30"
note = "Published as center-defect-coupling (the step) and center-periodic-of-coupling (the converse); the iff center_periodic_iff_coupling is host Lean only because LexLean cannot state a quantifier inside an iff. Exact restatement of the lag-P fixed-point difference, not a refutation."

[[claim]]
id = "aperiodic-compensation"
status = "open"
statement = "Under a hypothetical center period, the two column-one defects (each aperiodic by Jen) cannot satisfy the gated mirror forever. This is the remaining obligation."
since = "2026-10-28"
note = "Every proved reduction ends here. A closing argument needs an invariant of the single-seed orbit that the gated mirror violates."

[[claim]]
id = "q-adic-descent"
status = "refuted"
statement = "The q-adic order of the observer defect carries a descent quantity."
lean = "Rule30UOR.WittDefect.observer_front_q_rank"
since = "2026-10-30"
note = "On the seed, qOrder(E_t) is distributed like a random polynomial (ratio 1/4 per level, all Q); R_t = t + Q - O(1). experiments/diagnose_front_coupling.py."

[[claim]]
id = "front-slack-descent"
status = "refuted"
statement = "Phi_t = R_t - k_t (q-rank minus front depth) is a non-increasing potential."
since = "2026-10-30"
note = "Increases on most steps of every class. experiments/diagnose_front_coupling.py."

[[claim]]
id = "evaluation-point"
status = "refuted"
statement = "Evaluating the observer polynomial at a constant point (0, 1, omega, omega^2) constrains the center."
since = "2026-10-30"
note = "0 is the center itself, 1 is a coin (parity table in experiments/diagnose_front_coupling.py), omega and omega^2 are conjugate and give the q-order histogram of the same script."

[[claim]]
id = "gate-phase-opposition"
status = "refuted"
statement = "At a coupled arrival the gate phase is the negative of centerSign * rightPhase(start, 2)."
lean = "Rule30UOR.WittDefect.head_import_path_rejects_negative_gate"
lexeme = "r30.observation::head-import-path-rejects-negative-gate"
since = "2026-10-30"
note = "The sign is positive on every admissible window (head_import_path_gate_phase); the opposition is false under a periodic center, so no contradiction follows from it."

[[claim]]
id = "band-engines"
status = "refuted"
statement = "The lhBandAgree / prefix-tail / late-scale engine hypothesis bundles refute a periodic center."
lean = "Rule30UOR.Interfaces.lhBandAgree_engine_hypotheses_unsat"
since = "2026-10-28"
note = "Batch 86: the bundles imply False with no periodicity premise, so they are vacuous as engines. problem1_iff_engine_input is an equivalence, not a discharge."

[[claim]]
id = "recurrent-central-collision"
status = "proved"
statement = "Problem 1 is equivalent to: under every hypothetical center period, central collisions do not occur arbitrarily late in the band of width 2P."
lean = "Rule30UOR.Frontier.problem1_iff_noRecurrentCentralCollision"
lexeme = "r30.frontier::problem-one-iff-no-recurrent-central-collision"
since = "2026-10-27"
note = "Band form since the choice elimination; the fixed-column form needs the infinite pigeonhole principle."

[[claim]]
id = "saturation-reexcitation"
status = "refuted"
statement = "Under a periodic center, each front arrival injects a unit boundary bit that re-excites the observer polynomial, so the center cannot settle (the RF/photonics heat-death reading)."
lean = "Rule30UOR.WittDefect.periodic_arrival_no_crossing"
since = "2026-10-31"
note = "Backwards: at an arrival the boundary bit is the admitted right defect, and by the coupling law it cancels the arriving left defect, so the next center defect is zero (periodic_arrival_no_crossing). The unit bit protects the center's period. The budget-drain half of the reading is the refuted q-adic-descent: R_t = t + Q - O(1) grows, it never saturates."
depends = ["coupling-law"]

[[claim]]
id = "horizon-criterion"
status = "open"
statement = "For every T and P > 0 there is an explicit horizon H(T, P) such that CenterPeriodic T P already fails on the window [T, T + H(T, P)]: a flip forced by the doubling zero diagonal of P reaches column -1 inside the window while the gated mirror forbids it there."
since = "2026-10-31"
note = "The finite-target shape of batch 35. experiments/agreement_runs.py: the longest center-agreement run at lag Q grows with the transient (max over Q <= 64: 15 at T = 2^8, 17 at 2^11, 18 at 2^13, 20 at 2^16), as for a random sequence, so H must depend on T; candidate H(T, P) = O(T + P). Coordinate warning (2026-10-31): diagonal_phase_doubles compares diagonal z+1 at t and t+Q, i.e. columns -m and -(m+Q) (ldiag_eq_cell_neg); a leftDefect compares one column at two times, i.e. two diagonals Q apart. An antiperiodic diagonal is therefore not a supply of column defects marching to the center; its column-coordinate consequences under a periodic center are the *_of_doubles bundles of batches 20-49, which are vacuous as engines (band-engines). A horizon proof needs a column-coordinate forcing from the doubling point, which no theorem here provides."
depends = ["aperiodic-compensation", "problem1"]
