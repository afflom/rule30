status = "open"
statement = "No eventually periodic boundary with black times is black-time consistent: if a boundary column c with c 0 = true satisfies c (t+1) = NOT (column -1 of the left half it drives) at every black time t, and is eventually periodic, it is eventually white (NoPeriodicBlackConsistent). This left-only statement implies Problem 1."
