[[claim]]
id = "ledger-diagonal"
status = "proved"
statement = "The center column is the complement of the diagonal of the carry ledger: center t = not (bit t of winWitt 0 t), because row t = q^t XOR ledger and the central trinomial coefficient of q^t is odd; hence a center period is exactly a period of the ledger diagonal."
lean = "Rule30UOR.Ledger.centerPeriodic_iff_ledgerPeriodic"
since = "2026-10-31"
note = "Rule30UOR.Ledger: phi = phiLinear XOR (carry << 1) exactly; row t = phiLinearPow t 1 XOR winWitt 0 t; linear_center proves bit t of q^t is 1 by Frobenius (q^(2m) = q(X^2)^m, phiLinPow_spread) without binomial sums; bits t+1 and t-1 of q^t are the trailing-ones parity a(t) of t (linear_above_center, linear_below_center; a(2m) = 0, a(2m+1) = not a(m)). The center's update in ledger coordinates (center_succ_ledger): center(t+1) = rule(a(t) XOR l(t, t+1), not l(t, t), a(t) XOR l(t, t-1)) with l(t, j) = bit j of winWitt 0 t. The nonlinearity of Rule 30 sits entirely in the carries, and the readout is the single level-crossing operation (decode, accumulate exactly, encode once). aperiodic-compensation in this form: the ledger diagonal is not eventually periodic."
depends = ["problem1"]
relation = ["one", "center", "ledger-diagonal"]
window = 256
kappa = "sha256:c342ad6c6b42ac0685ede07d2a55b294bac6a506212d081f568b37ba76d407f0"

