[[claim]]
id = "horizon-criterion"
status = "open"
statement = "For every T and P > 0 there is an explicit horizon H(T, P) such that CenterPeriodic T P already fails on the window [T, T + H(T, P)]: a flip forced by the doubling zero diagonal of P reaches column -1 inside the window while the gated mirror forbids it there."
since = "2026-10-31"
note = "The finite-target shape of batch 35. experiments/agreement_runs.py: the longest center-agreement run at lag Q grows with the transient (max over Q <= 64: 15 at T = 2^8, 17 at 2^11, 18 at 2^13, 20 at 2^16), as for a random sequence, so H must depend on T. Kernel-checked instance: horizon-certificate (H = 32 for all T <= 512, 0 < P <= 128). Coordinate warning (2026-10-31): diagonal_phase_doubles compares diagonal z+1 at t and t+Q, i.e. columns -m and -(m+Q) (ldiag_eq_cell_neg); a leftDefect compares one column at two times. The column-coordinate forcing from the doubling point that exists is a window, not a time: DefectFront.left_edge_defect (unconditional, depth t + mP) with DefectFront.exists_unit_defect_and_white_center_of_periodic or LeftCone.left_defect_sourced gives a column-one arrival somewhere in [t, 2t + mP). A window as long as the transient yields no horizon (arrivals at s_k = 2 s_(k-1) + P already satisfy every window), while the actual first failure is at T + O(log T) (first-failure-2adic). The gap between the exact forcing (exponentially sparse arrivals) and the observed law is where any horizon proof must come from; nothing exact here sees the logarithm."
depends = ["aperiodic-compensation", "horizon-certificate"]

