since = "2026-11-01"
note = "Rule30UOR.DiagonalCone (round 4): BlackTimeConsistent, blackDefect, drivenCone, driven_duhamel, driven_cone_iff_btc (for the left half Lh c driven by any c with c 0 = true, not drivenCone c = c XOR the parity of the black-time defects so far), center_blackTimeConsistent, problem1_of_noPeriodicBlackConsistent, noPeriodicConsistent_of_noPeriodicBlackConsistent, WhiteTimeConsistent, problem1_iff_noPeriodicConsistent (the full fixed point is Problem 1), noPeriodicBlackConsistent_of_drivenLeftMask (from the kit's LeftMask). Jen's argument needs column -1 at all times; black-time consistency supplies it only at black times; at white times column -1 is c (t+1) XOR the effective column +1, which the left half leaves free. Falsification check (not evidence for truth): of 63,754 eventually periodic boundaries with black times (prefix <= 7, period <= 8), none is black-time consistent for 260 steps."
