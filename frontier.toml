[[claim]]
id = "saturation-reexcitation"
status = "refuted"
statement = "Under a periodic center, each front arrival injects a unit boundary bit that re-excites the observer polynomial, so the center cannot settle (the RF/photonics heat-death reading)."
lean = "Rule30UOR.WittDefect.periodic_arrival_no_crossing"
since = "2026-10-31"
note = "Backwards: at an arrival the boundary bit is the admitted right defect, and by the coupling law it cancels the arriving left defect, so the next center defect is zero (periodic_arrival_no_crossing). The unit bit protects the center's period. The budget-drain half of the reading is the refuted q-adic-descent: R_t = t + Q - O(1) grows, it never saturates."
depends = ["aperiodic-compensation"]

[[claim]]
id = "horizon-criterion"
status = "open"
statement = "For every T and P > 0 there is an explicit horizon H(T, P) such that CenterPeriodic T P already fails on the window [T, T + H(T, P)]: a flip forced by the doubling zero diagonal of P reaches column -1 inside the window while the gated mirror forbids it there."
since = "2026-10-31"
note = "The finite-target shape of batch 35. experiments/agreement_runs.py: the longest center-agreement run at lag Q grows with the transient (max over Q <= 64: 15 at T = 2^8, 17 at 2^11, 18 at 2^13, 20 at 2^16), as for a random sequence, so H must depend on T. Kernel-checked instance: horizon-certificate (H = 32 for all T <= 512, 0 < P <= 128). Coordinate warning (2026-10-31): diagonal_phase_doubles compares diagonal z+1 at t and t+Q, i.e. columns -m and -(m+Q) (ldiag_eq_cell_neg); a leftDefect compares one column at two times. The column-coordinate forcing from the doubling point that exists is a window, not a time: DefectFront.left_edge_defect (unconditional, depth t + mP) with DefectFront.exists_unit_defect_and_white_center_of_periodic or LeftCone.left_defect_sourced gives a column-one arrival somewhere in [t, 2t + mP). A window as long as the transient yields no horizon (arrivals at s_k = 2 s_(k-1) + P already satisfy every window), while the actual first failure is at T + O(log T) (first-failure-2adic). The gap between the exact forcing (exponentially sparse arrivals) and the observed law is where any horizon proof must come from; nothing exact here sees the logarithm."
depends = ["aperiodic-compensation", "horizon-certificate"]

[[claim]]
id = "horizon-certificate"
status = "proved"
statement = "For every transient T ≤ 512 and period 0 < P ≤ 128 the center disagrees with its lag-P shift at a time in [T, T + 32): the horizon H = 32 is a kernel-checked certificate on these ranges."
lean = "Rule30UOR.Horizon.horizon_thirty_two"
since = "2026-10-31"
note = "Rule30UOR.Horizon: rows are Nat bit-vectors, so the kernel evaluates the center column directly; shortPeriodsFail 512 128 32 = true by decide (about 70 s), with the checker proved sound against CenterPeriodic (no_center_period_512_128). Each certificate is finite; the open claim is the uniform H(T, P). Extending the ranges costs kernel time linearly in T0 * P0 * H."
depends = ["aperiodic-compensation"]

[[claim]]
id = "left-defect-sourcing"
status = "proved"
statement = "Under a periodic center, a left defect at depth k at time t is sourced by a right column-one defect at a time in [t, t + k); equivalently column-one agreement on [t, t + k) forces the whole left cone of depth k at t to agree."
lean = "Rule30UOR.LeftCone.left_defect_sourced"
since = "2026-10-31"
note = "Rule30UOR.LeftCone: left-permutivity on temporal defects (defect_left_of_agree, from defect_step_linear) iterated from the center; the center hypothesis is free under CenterPeriodic (left_cone_of_right_agrees, hypothesis RightAgrees decidable); the witness is a bounded search, no choice. The coupling law at every depth: the left defect field at times >= T is a function of the right column-one defect sequence and the periodic center."
depends = ["aperiodic-compensation"]

[[claim]]
id = "first-failure-2adic"
status = "refuted"
statement = "The first time a hypothetical center period (T, P) fails is governed by the 2-adic data of P and T (the scale mismatch between the periodically seeded right half and the doubling-time reconstruction of the left edge), so the closing invariant can be read off the first failing comparison."
since = "2026-10-31"
note = "experiments/first_failure.py (2026-10-31): over T in [256, 4352) and P in [1, 256], delay(T, P) = first d with center(T+d+P) != center(T+d) follows the fair-bit law Pr[d >= k] = 2^-k to within 0.3% for k <= 10 in every class by v2(P), P mod 8, T mod 8, and for P = 2^k by T mod P (residue means 0.73 to 1.23 at P = 32 over 128 samples each, noise). The first failure carries no 2-adic signature; an obstruction, if any, is exact and not statistical, and cannot be read from where a period first breaks."
depends = ["aperiodic-compensation"]

[[claim]]
id = "ledger-diagonal"
status = "proved"
statement = "The center column is the complement of the diagonal of the carry ledger: center t = not (bit t of winWitt 0 t), because row t = q^t XOR ledger and the central trinomial coefficient of q^t is odd; hence a center period is exactly a period of the ledger diagonal."
lean = "Rule30UOR.Ledger.centerPeriodic_iff_ledgerPeriodic"
since = "2026-10-31"
note = "Rule30UOR.Ledger: phi = phiLinear XOR (carry << 1) exactly; row t = phiLinearPow t 1 XOR winWitt 0 t; linear_center proves bit t of q^t is 1 by Frobenius (q^(2m) = q(X^2)^m, phiLinPow_spread) without binomial sums; bits t+1 and t-1 of q^t are the trailing-ones parity a(t) of t (linear_above_center, linear_below_center; a(2m) = 0, a(2m+1) = not a(m)). The center's update in ledger coordinates (center_succ_ledger): center(t+1) = rule(a(t) XOR l(t, t+1), not l(t, t), a(t) XOR l(t, t-1)) with l(t, j) = bit j of winWitt 0 t. The nonlinearity of Rule 30 sits entirely in the carries, and the readout is the single level-crossing operation (decode, accumulate exactly, encode once). aperiodic-compensation in this form: the ledger diagonal is not eventually periodic."
depends = ["problem1"]

[[claim]]
id = "periodic-finite-kernel"
status = "proved"
statement = "A periodic center has a finite 2-kernel: under CenterPeriodic T P every subsequence t -> center(2^k t + r), r < 2^k, is one of an explicit finite family (the kernel subsequences with 2^k < T + P, and t -> if t = 0 then b else center(T + (u t + v) mod P) with u, v < P)."
lean = "Rule30UOR.Automatic.centerKernelFinite_of_centerPeriodic"
since = "2026-10-31"
note = "Rule30UOR.Automatic, choice-free with an explicit family (Allouche-Shallit Thm 5.4.2, contrapositive form). Consequence: problem1_of_infinite_kernel, Problem 1 follows from CenterInfiniteKernel."
depends = ["problem1"]

[[claim]]
id = "center-infinite-kernel"
status = "open"
statement = "The center column is not 2-automatic: its 2-kernel, the family of subsequences t -> center(2^k t + r) with r < 2^k, is infinite. By Christol this is the transcendence of the series sum center(t) y^t over F_2(y); by Rowland-Yassawi it says the center is not a column of any linear cellular automaton over F_2."
since = "2026-10-31"
note = "Strict strengthening of problem1 with a larger toolbox (problem1_of_infinite_kernel). The kernel subsequences are generated by scale_center: center(t + 2^k) = center t XOR cell(t, -2^k) XOR response(t, k), so the 2-kernel of the center is the family of depth-2^k left cells and window responses. In ledger coordinates the linear part (trailingParity, the trinomial triangle) is 2-automatic, so this is the statement that the carry ledger's diagonal has no finite 2-kernel. Honkala's decidability does not apply (it presupposes automaticity). Not known."
depends = ["periodic-finite-kernel"]

[[claim]]
id = "kernel-self-similarity"
status = "proved"
statement = "A finite 2-kernel forces a dyadic self-similarity of the center: some k < k' with center(2^k' t) = center(2^k t) for all t (pigeonhole along the zero path of the kernel tree); hence Problem 1 follows from NoDyadicSelfSimilarity."
lean = "Rule30UOR.Automatic.problem1_of_no_dyadic_self_similarity"
since = "2026-10-31"
note = "Rule30UOR.Automatic: dyadic_self_similar_of_kernel2Finite (constructive pigeonhole on the listed family), centerInfiniteKernel_of_no_dyadic_self_similarity, problem1_of_no_dyadic_self_similarity."
depends = ["periodic-finite-kernel"]

[[claim]]
id = "no-dyadic-self-similarity"
status = "open"
statement = "For all k < k' there is a time t with center(2^k' t) != center(2^k t): the center column is not self-similar under any dyadic dilation."
lean = "Rule30UOR.Automatic.NoDyadicSelfSimilarity"
since = "2026-10-31"
note = "The most concrete sufficient condition for Problem 1 in the register: a witness t(k, k') against every pair of scales. Equivalent data: kernelSeq_step_late gives the step of center(2^k t) out of the cone as the symmetric pair of cells at distance 2^k XOR the Witt window response; two_places_settled gives the dyadic increments center(r + 2^(k+1)) XOR center(r + 2^k) as late Witt responses. A witness must compare two scales; single-scale (zero-state) engines were vacuous (band-engines)."
depends = ["kernel-self-similarity"]

[[claim]]
id = "dilation-reduction"
status = "proved"
statement = "A finite 2-kernel makes every dilation sequence j -> center(2^j t) eventually periodic with one common period; hence Problem 1 follows if a single dilation sequence, in particular the dyadic column j -> center(2^j), is not eventually periodic."
lean = "Rule30UOR.Automatic.problem1_of_dyadic_column_aperiodic"
since = "2026-10-31"
note = "Rule30UOR.Automatic: dilationPeriodic_of_kernel2Finite (substitute 2^j t into the self-similarity), problem1_of_dilation_aperiodic, problem1_of_dyadic_column_aperiodic. Transfers Problem 1 from the time axis to the scale axis."
depends = ["kernel-self-similarity"]

[[claim]]
id = "dyadic-column-aperiodic"
status = "open"
statement = "The dyadic column j -> center(2^j) is not eventually periodic."
lean = "Rule30UOR.Automatic.DyadicColumnAperiodic"
since = "2026-10-31"
note = "Sufficient for Problem 1 (dilation-reduction). Exact law: center(2^(j+1)) = center(2^j) XOR wittRespBool(2^j, j) (center_twopow_succ), so the column is the running XOR of the late Witt responses at dyadic times. Caveat: if the center were 2-adically continuous at 0 (constant on all multiples of some 2^K) this column would be eventually constant and the reduction silent; the claim therefore includes that wittRespBool(2^j, j) is not eventually zero. More generally SomeDilationAperiodic (any t) suffices. Not known."
depends = ["dilation-reduction"]

[[claim]]
id = "base-generic-reduction"
status = "proved"
statement = "For every base b >= 2 and every t, Problem 1 follows if the b-dilation sequence j -> center(b^j t) is not eventually periodic: a periodic center has a finite b-kernel, a finite b-kernel forces a b-adic self-similarity, and that makes every b-dilation sequence eventually periodic."
lean = "Rule30UOR.Automatic.problem1_of_dilation_aperiodic_in_paper"
since = "2026-10-31"
note = "Rule30UOR.Automatic, base-parametrized (bpow, KernelFiniteIn, kernelFiniteIn_of_centerPeriodic, self_similar_of_kernelFiniteIn, dilationPeriodicIn_of_kernelFiniteIn). The 2-adic claims are the case b = 2. Bases are orthogonal in Cobham's sense; the orbit's exact structure is 2-adic, so a base that is not a power of two is a direction with no built-in self-similarity."
depends = ["periodic-finite-kernel"]

[[claim]]
id = "some-base-dilation-aperiodic"
status = "open"
statement = "There are a base b >= 2 and a time t such that the dilation sequence j -> center(b^j t) is not eventually periodic."
since = "2026-10-31"
note = "Sufficient for Problem 1 (base-generic-reduction). dyadic-column-aperiodic is the instance b = 2, t = 1 with its 2-adic continuity caveat; a base that is not a power of two has no such caveat supplied by the orbit's Witt structure. The mechanical task is to choose (b, t) against the orbit's own scale and prove the aperiodicity of one sequence."
depends = ["base-generic-reduction"]

[[claim]]
id = "kappa-collapse"
status = "proved"
statement = "kappa-collapse at scale K (every cone window response at scales >= K vanishes, i.e. the carries no longer reach the center) is exactly a center period 2^K from time 0; the horizon certificate refutes it for K <= 7, and Problem 1 is equivalent to no kappa-collapse at any scale together with no period that is not a power of two."
lean = "Rule30UOR.Automatic.kappaCollapse_iff"
since = "2026-10-31"
note = "Rule30UOR.Automatic: KappaCollapse K := all response r k = false for K <= k, r < 2^k; center_mod_of_kappaCollapse (the center is then a function of n mod 2^K), centerPeriodic_of_kappaCollapse, kappaCollapse_of_centerPeriodic, no_kappaCollapse_small (K <= 7), no_kappaCollapse_of_problem1. The collapse of the leaves is the root: the carries' uniform vanishing across scales is the period itself."
depends = ["ledger-diagonal", "horizon-certificate"]
