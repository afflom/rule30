name: Build and Release Rule 30 LexLean Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Lean 4 + LexLean PDFs & Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up proof toolchain
        uses: ./.github/actions/setup-proof-tools

      - name: Run complete acceptance gate (proofs, LexLean, tooling, PDFs)
        env:
          RULE30_REFRESH_PDFS: "0"
        run: make check-ci LEXLEAN="$LEXLEAN_BIN"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rule30-lexlean-artifacts
          path: dist/*

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Rule30-Paper.pdf
            dist/Paper.pdf
            dist/Rule30-Core.pdf
            dist/Core.pdf
            dist/Paper.lean
            dist/Paper.tex
            dist/Core.lean
            dist/Core.tex
            dist/Observations.pdf
            dist/Observations.lean
            dist/Observations.tex
            dist/paper-attestation-*.json
            dist/core-attestation-*.json
            dist/paper-lexlean.lock
            dist/core-lexlean.lock
            dist/lexlean-paper-verified-*.tar.gz
            dist/lexlean-core-verified-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

