name: Build and Release Rule 30 LexLean Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Lean 4 + LexLean PDFs & Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up proof toolchain
        uses: ./.github/actions/setup-proof-tools

      - name: Run complete acceptance gate (proofs, LexLean, tooling, PDFs)
        env:
          RULE30_REFRESH_PDFS: "0"
        run: make check-ci LEXLEAN="$LEXLEAN_BIN"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rule30-lexlean-artifacts
          path: dist/*
          if-no-files-found: error

  download-smoke:
    name: Check downloaded mathematical assets
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Download the candidate assets without a source checkout
        uses: actions/download-artifact@v4
        with:
          name: rule30-lexlean-artifacts
          path: dist

      - name: Check required assets and downloaded bytes
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          # Validate paths before checksum-controlled file access. Assets must
          # be flat regular files, with no symlinks or hidden extras.
          shopt -s dotglob nullglob
          for asset in *; do
            [[ "$asset" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
            test -f "$asset" && test ! -L "$asset"
          done
          test -s SHA256SUMS
          while IFS= read -r record || [[ -n "$record" ]]; do
            [[ "$record" =~ ^[0-9a-f]{64}\ \ [A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          done < SHA256SUMS
          for asset in Rule30-Paper.pdf Paper.pdf Rule30-Core.pdf Core.pdf \
            Paper.lean Paper.tex Core.lean Core.tex \
            Observations.pdf Observations.lean Observations.tex \
            paper-lexlean.lock core-lexlean.lock SHA256SUMS; do
            test -s "$asset"
          done
          for pattern in 'paper-attestation-*.json' 'core-attestation-*.json' \
            'lexlean-paper-verified-*.tar.gz' 'lexlean-core-verified-*.tar.gz'; do
            mapfile -t matches < <(compgen -G "$pattern")
            test "${#matches[@]}" -eq 1
            test -s "${matches[0]}"
          done
          sha256sum --check --strict SHA256SUMS
          # Check coverage too: an unlisted extra file must not be published.
          sha256sum -- * | sed '/  SHA256SUMS$/d' > "$RUNNER_TEMP/downloaded-checksums"
          sort SHA256SUMS > "$RUNNER_TEMP/expected-checksums"
          sort "$RUNNER_TEMP/downloaded-checksums" > "$RUNNER_TEMP/actual-checksums"
          cmp "$RUNNER_TEMP/expected-checksums" "$RUNNER_TEMP/actual-checksums"
          cmp Rule30-Paper.pdf Paper.pdf
          cmp Rule30-Core.pdf Core.pdf
          for bundle in lexlean-*-verified-*.tar.gz; do
            tar -tzf "$bundle" > /dev/null
          done

  publish:
    name: Publish qualified release assets
    needs: download-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require v0.2 native release qualification
        if: github.ref_name == 'v0.2' || startsWith(github.ref_name, 'v0.2.') || startsWith(github.ref_name, 'v0.2-')
        run: |
          echo '::error::v0.2 native packaging and consumer qualification are pending. See docs/releases/v0.2.md; mathematical asset checks alone do not qualify this release.'
          exit 1

      - name: Download the checked candidate assets
        uses: actions/download-artifact@v4
        with:
          name: rule30-lexlean-artifacts
          path: dist

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/Rule30-Paper.pdf
            dist/Paper.pdf
            dist/Rule30-Core.pdf
            dist/Core.pdf
            dist/Paper.lean
            dist/Paper.tex
            dist/Core.lean
            dist/Core.tex
            dist/Observations.pdf
            dist/Observations.lean
            dist/Observations.tex
            dist/paper-attestation-*.json
            dist/core-attestation-*.json
            dist/paper-lexlean.lock
            dist/core-lexlean.lock
            dist/lexlean-paper-verified-*.tar.gz
            dist/lexlean-core-verified-*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

