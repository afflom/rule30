name: Main Branch Validation

# The complete gate already runs before every commit and push (the hooks);
# running it again on every push would only slow the research down. It stays
# available on demand and on pull requests from outside the hooks.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and Validate (No Publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up proof toolchain
        uses: ./.github/actions/setup-proof-tools

      - name: Run complete acceptance gate (proofs, LexLean, tooling, PDFs)
        env:
          RULE30_REFRESH_PDFS: "0"
        run: make check-ci LEXLEAN="$LEXLEAN_BIN"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rule30-main-validation-artifacts
          path: dist/*
