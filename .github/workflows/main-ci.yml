name: Main Branch Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and Validate (No Publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up proof toolchain
        uses: ./.github/actions/setup-proof-tools

      - name: Test authoring policy and build tooling
        run: make check-tooling

      - name: Run research gate (build + audits + leanchecker)
        run: make check-research

      - name: Build bridge package
        run: make bridge

      - name: Run LexLean verification (core + paper)
        run: |
          make lexlean LEXLEAN="$LEXLEAN_BIN"
          git diff --exit-code -- rule30-lexlean/lexlean.lock rule30-paper/lexlean.lock

      - name: Build PDFs and release artifacts (without publishing)
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh --package-only

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rule30-main-validation-artifacts
          path: dist/*
