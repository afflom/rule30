name: Main Branch Validation

# The complete gate already runs before every commit and push (the hooks);
# running it again on every push would only slow the research down. It stays
# available on demand and on pull requests from outside the hooks.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and Validate (No Publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up proof toolchain
        uses: ./.github/actions/setup-proof-tools

      - name: Restore the factory's gate evidence
        uses: actions/cache/restore@v4
        with:
          path: .git/rule30-validation
          key: r30-gate-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            r30-gate-${{ runner.os }}-

      - name: Run complete acceptance gate (proofs, LexLean, tooling, PDFs)
        env:
          RULE30_REFRESH_PDFS: "0"
        run: python3 scripts/validate_git_tree.py "$GITHUB_SHA"

      - name: Prune the factory's retained evidence
        run: bin/r30 engine prune --apply

      - name: Save the factory's gate evidence
        uses: actions/cache/save@v4
        with:
          path: .git/rule30-validation
          key: r30-gate-${{ runner.os }}-${{ github.sha }}

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rule30-main-validation-artifacts
          include-hidden-files: true
          path: |
            Rule30-Core.pdf
            Rule30-Paper.pdf
            Rule30-Observations.pdf
            pdf-manifest.json
            rule30-lexlean/pdf/*.tex
            rule30-paper/pdf/*.tex
            .git/rule30-validation/lexlean/**/attestation.json
