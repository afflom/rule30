name: Main Branch Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and Validate (No Publish)
    runs-on: ubuntu-latest
    env:
      LEXLEAN_BIN: ${{ github.workspace }}/.local/bin/lexlean
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra \
            cm-super

      - name: Install Elan and Lean 4.32.1 toolchain
        run: |
          for i in 1 2 3 4 5; do
            curl --retry 5 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none && break
            sleep 3
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          for i in 1 2 3 4 5; do
            elan toolchain install leanprover/lean4:v4.32.1 && elan default leanprover/lean4:v4.32.1 && break
            echo "Retrying Lean 4.32.1 toolchain download (attempt $i)..."
            sleep 5
          done
          lean --version
          lake --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-lexlean-v0.3.0

      - name: Install LexLean v0.3.0
        run: |
          mkdir -p "$(dirname "$LEXLEAN_BIN")"
          cargo install --locked --git https://github.com/afflom/lexlean --tag v0.3.0 --root "${{ github.workspace }}/.local" lexlean
          "$LEXLEAN_BIN" --version

      - name: Run research gate (build + audits + leanchecker)
        run: make check-research

      - name: Build bridge package
        run: make bridge

      - name: Run LexLean verification (core + paper)
        run: make lexlean LEXLEAN="$LEXLEAN_BIN"

      - name: Build PDFs and release artifacts (without publishing)
        run: make release-artifacts

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rule30-main-validation-artifacts
          path: dist/*
