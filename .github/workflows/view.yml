name: Current view for stakeholders

# Every push to main publishes the current state of the implementation as a
# light artifact: the reduction tree, the register, the interface sheets, the
# LexLean API modules and the site that renders them. What is published is
# what rule30-api/src/Presentation.lex.tex declares; `bin/r30 view render` is
# its runtime. Validation already happened in the pre-commit gate (every
# commit on main passed it), so this workflow runs no Lean, no lexlean and no
# tests: it must never slow the research down.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: view-${{ github.ref }}
  cancel-in-progress: true

jobs:
  view:
    name: Render the current view
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render the view artifacts
        run: python3 -m tools.r30 view render --out view
      - name: Upload the view
        uses: actions/upload-artifact@v4
        with:
          name: rule30-current-view
          path: view
